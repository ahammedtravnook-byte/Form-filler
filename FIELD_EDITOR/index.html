<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Field Coordinate Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-left">
          <h1>PDF Field Editor</h1>
          <select id="templateSelect">
            <option value="">— select a template —</option>
          </select>
          <span id="status" class="status"></span>
        </div>
        <div class="topbar-right">
          <label class="zoom-label">
            Zoom
            <input id="zoom" type="range" min="0.5" max="2" step="0.1" value="1" />
            <span id="zoomVal">100%</span>
          </label>
          <button id="saveBtn" disabled>Save newfields.json</button>
        </div>
      </header>

      <main class="layout">
        <section id="viewer" class="viewer">
          <div id="viewerEmpty" class="empty">Select a template to begin.</div>
          <div id="pages"></div>
        </section>

        <aside class="sidebar">
          <div class="sidebar-head">
            <h2>Fields</h2>
            <input id="fieldFilter" type="search" placeholder="Filter fields…" />
          </div>
          <div id="fieldList" class="field-list"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
